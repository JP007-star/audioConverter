<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-Audio Converter | Convert Text to Speech Online</title>
    <meta name="description" content="Convert your text to audio using our online Text-to-Audio Converter. Choose from various languages and speeds for your audio output.">
    <meta name="keywords" content="text-to-audio, text-to-speech, convert text to audio, online audio converter, speech synthesis">
    <meta name="author" content="Your Name">
    <meta property="og:title" content="Text-to-Audio Converter">
    <meta property="og:description" content="Convert your text to audio using our online Text-to-Audio Converter. Choose from various languages and speeds for your audio output.">
    <meta property="og:image" content="URL_TO_AN_IMAGE_REPRESENTING_YOUR_SITE">
    <meta property="og:url" content="https://audioconverter-imi7.onrender.com">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://audioconverter-imi7.onrender.com">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, select, textarea, button {
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        h1, h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text-to-Audio Converter</h1>
        <form id="textToAudioForm">
            <label for="text">Text:</label>
            <textarea id="text" name="text" rows="4" required></textarea>

            <label for="voice">Voice:</label>
            <select id="voice" name="voice">
                <option value="en-male">English (Male)</option>
                <option value="en-female">English (Female)</option>
                <option value="es-male">Spanish (Male)</option>
                <option value="es-female">Spanish (Female)</option>
                <option value="fr-male">French (Male)</option>
                <option value="fr-female">French (Female)</option>
                <option value="de-male">German (Male)</option>
                <option value="de-female">German (Female)</option>
                <option value="ta-male">Tamil India (Male)</option>
                <option value="ta-female">Tamil India (Female)</option>
                <option value="ta-lk-male">Tamil Sri Lanka (Male)</option>
                <option value="ta-lk-female">Tamil Sri Lanka (Female)</option>
                <option value="ta-my-male">Tamil Malaysia (Male)</option>
                <option value="ta-my-female">Tamil Malaysia (Female)</option>
                <option value="ta-sg-male">Tamil Singapore (Male)</option>
                <option value="ta-sg-female">Tamil Singapore (Female)</option>
                <option value="te-male">Telugu (Male)</option>
                <option value="te-female">Telugu (Female)</option>
                <option value="kn-male">Kannada (Male)</option>
                <option value="kn-female">Kannada (Female)</option>
                <option value="ml-male">Malayalam (Male)</option>
                <option value="ml-female">Malayalam (Female)</option>
                <option value="ja-male">Japanese (Male)</option>
                <option value="ja-female">Japanese (Female)</option>
                <option value="ko-male">Korean (Male)</option>
                <option value="ko-female">Korean (Female)</option>
                <option value="hi-male">Hindi (Male)</option>
                <option value="hi-female">Hindi (Female)</option>
                <option value="zh-CN-male">Chinese (Simplified) Male</option>
                <option value="zh-CN-female">Chinese (Simplified) Female</option>
                <option value="ru-male">Russian (Male)</option>
                <option value="ru-female">Russian (Female)</option>
            </select>

            <label for="speed">Speed:</label>
            <select id="speed" name="speed">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>

            <button type="button" id="convertBtn">Convert to Audio</button>
        </form>

        <h2>Audio Output</h2>
        <audio id="audioPlayer" controls></audio>

        <div id="responseMessage"></div>
    </div>

    <script>
        (function() {
            const convertBtn = document.getElementById('convertBtn');
            const textInput = document.getElementById('text');
            const voiceInput = document.getElementById('voice');
            const speedInput = document.getElementById('speed');
            const audioPlayer = document.getElementById('audioPlayer');
            const responseMessage = document.getElementById('responseMessage');

            convertBtn.addEventListener('click', async () => {
                const text = textInput.value;
                const voice = voiceInput.value;
                const speed = speedInput.value;

                if (!text) {
                    responseMessage.innerHTML = '<p style="color: red;">Please enter some text.</p>';
                    return;
                }

                responseMessage.innerHTML = '<p>Converting... Please wait.</p>';
                convertBtn.disabled = true;

                try {
                    const response = await fetch('http://localhost:3000/text-to-audio', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text, voice, speed })
                    });

                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const blob = await response.blob();
                    const audioUrl = URL.createObjectURL(blob);
                    audioPlayer.src = audioUrl;
                    audioPlayer.play();

                    responseMessage.innerHTML = '';
                } catch (error) {
                    console.error('Error:', error);
                    responseMessage.innerHTML = `<p style="color: red;">Failed to convert text to audio. ${error.message}</p>`;
                } finally {
                    convertBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
